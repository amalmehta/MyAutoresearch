[project]
name = "my-autoresearch"
version = "0.1.0"
description = "My Autoresearch: an agent edits your code, runs your benchmark, and keeps only what improves the metric."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.8", "numpy>=1.26"]

[project.scripts]
autoresearch = "autoresearch.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoresearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
